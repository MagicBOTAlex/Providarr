[package]
name = "providarr"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
governor = "0.10.4"
hex = "0.4.3"
http = "1.5.0"
humantime-serde = "1.1.1"
hyper = { version = "1.11.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "http1", "http2", "tokio", "service"] }
libc = "0.2"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
once_cell = "1.21.4"
parking_lot = "0.12.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "stream"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "request-id", "compression-full", "catch-panic"] }
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
postgresql_embedded = { version = "0.21", default-features = false, features = ["theseus", "tokio", "tls-rustls-ring"] }
pretty_assertions = "1.4.1"
serial_test = "4.0.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
