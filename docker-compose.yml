# Providarr + external Postgres (recommended).
#
#   cp .env.example .env    # fill in TMDB_API_TOKEN / TVDB_API_KEY
#   docker compose up -d --build
#
# Secrets are read from `.env` (gitignored). The DATABASE_URL in `.env` is
# overridden below to point at the `postgres` service.
name: providarr

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Required by the official image entrypoint to chown PGDATA and drop
      # privileges from root to the postgres user.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_USER: providarr
      POSTGRES_PASSWORD: providarr
      POSTGRES_DB: providarr
    volumes:
      - providarr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U providarr -d providarr"]
      interval: 10s
      timeout: 5s
      retries: 5

  providarr:
    build:
      context: .
      dockerfile: Dockerfile
    image: magicbotalex2/providarr:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env so it targets the service.
      DATABASE_URL: postgres://providarr:providarr@postgres:5432/providarr
      PROVIDARR_CONFIG: /app/config/config.json
    ports:
      - "4155:4155"
    volumes:
      - providarr-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4155/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  providarr-postgres:
  providarr-logs:
